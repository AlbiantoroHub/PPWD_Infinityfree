<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Portofolio Saya</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigasi -->
    <nav>
        <div class="container">
            <div class="logo">MyPortofolio</div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Flexbox akan mengatur agar teks dan gambar bersebelahan -->
        <div class="container hero-container">
            <div class="hero-content">
                <h1>Halo, Saya <span id="typing-text"></span></h1>
                <p>Mahasiswa Sistem Informasi</p>
                <a href="contact.html" class="btn">Hubungi Saya</a>
            </div>
            
            <!-- Implementasi tag img dengan atribut alt dari materi kuis -->
            <img src="Media/fotoprofil.jpeg" alt="Foto Profil Chattama" class="hero-image">
        </div>
    </section>

    <!-- Proyek Saya -->
    <section class="projects">
        <div class="container">
            <h2>Proyek Saya</h2>
            <div class="project-grid" id="project-grid">
                <!-- Contoh kerangka statis sementara sebelum diisi otomatis oleh JavaScript -->
                <div class="project-card">
                    <h3>Aplikasi Donasi</h3>
                    <p>Web donasi menggunakan PHP, HTML, CSS, dan JS.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Chattama Albiantoro | <a href="https://github.com/AlbiantoroHub" target="_blank">Lihat GitHub Saya</a></p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
